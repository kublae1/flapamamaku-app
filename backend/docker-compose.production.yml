services:
  flapamamaku-backend:
    image: ghcr.io/kublae1/flapamamaku-backend:latest
    pull_policy: always
    container_name: ${FLAPAMAMAKU_CONTAINER_NAME:-flapamamaku-backend}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FLAPAMAMAKU_HOST_PORT:-8087}:8000"
    environment:
      FLAPAMAMAKU_DB: /data/flapamamaku.db
      FLAPAMAMAKU_BACKUP_DIR: /data/backups
      FLAPAMAMAKU_BACKUP_RETENTION: ${FLAPAMAMAKU_BACKUP_RETENTION:-14}
      FLAPAMAMAKU_BACKUP_INTERVAL_SECONDS: ${FLAPAMAMAKU_BACKUP_INTERVAL_SECONDS:-86400}
      FLAPAMAMAKU_INSTANCE_ID: ${FLAPAMAMAKU_INSTANCE_ID:-flapamamaku}
      FLAPAMAMAKU_ENV: production
      FLAPAMAMAKU_ALLOWED_ORIGINS: ${FLAPAMAMAKU_ALLOWED_ORIGINS}
      FLAPAMAMAKU_BUILD_SHA: ${FLAPAMAMAKU_BUILD_SHA:-unknown}
      FLAPAMAMAKU_API_VERSION: ${FLAPAMAMAKU_API_VERSION:-0.9.3}
      FLAPAMAMAKU_PUBLIC_URL: ${FLAPAMAMAKU_PUBLIC_URL:-https://flapamamaku.kublaecloud.synology.me}
      FLAPAMAMAKU_PLATFORM_DB: /platform/platform.db
    volumes:
      - flapamamaku-data:/data
      - platform-data:/platform
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)); assert d.get('status')=='ok'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  flapamamaku-platform:
    image: ghcr.io/kublae1/flapamamaku-backend:latest
    pull_policy: always
    container_name: ${FLAPAMAMAKU_PLATFORM_CONTAINER_NAME:-flapamamaku-platform}
    restart: unless-stopped
    command: ["uvicorn", "app.platform_runtime:app", "--host", "0.0.0.0", "--port", "8091"]
    ports:
      - "127.0.0.1:${FLAPAMAMAKU_PLATFORM_HOST_PORT:-8091}:8091"
    environment:
      FLAPAMAMAKU_PLATFORM_DB: /platform/platform.db
      FLAPAMAMAKU_PLATFORM_SESSION_DAYS: ${FLAPAMAMAKU_PLATFORM_SESSION_DAYS:-30}
      FLAPAMAMAKU_PLATFORM_BILLING_INTERVAL_SECONDS: ${FLAPAMAMAKU_PLATFORM_BILLING_INTERVAL_SECONDS:-3600}
    volumes:
      - platform-data:/platform
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8091/api/platform/health',timeout=5)); assert d.get('status')=='ok'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  flapamamaku-data:
  platform-data:
    name: flapamamaku-platform-data
