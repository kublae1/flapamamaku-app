name: flapamamaku_app
description: FLAPAMAMAKU Fasnachtsgruppe Luzern - mobile app
publish_to: 'none'
version: 0.8.7+22

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  http: ^1.5.0
  shared_preferences: ^2.5.3
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/FLAPAMAMAKU App-Icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/FLAPAMAMAKU App-Icon.png
    - assets/images/hero_fireworks.jpg
    - assets/images/year_motto_pig_rockers.jpg
    - assets/images/archive_top_hats_night.jpg
    - assets/images/archive_top_hats_barrel.jpg
    - assets/images/archive_vikings_bar.jpg
