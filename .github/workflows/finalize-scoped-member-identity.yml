name: Finalize Scoped Member Identity

on:
  push:
    branches:
      - finalize/masterplan-phase9-20261007
    paths:
      - tools/apply_scoped_member_identity_fix.py
      - tools/apply_scoped_member_identity_fix_v2.py
      - .github/workflows/finalize-scoped-member-identity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped member identity patch
        run: python tools/apply_scoped_member_identity_fix_v2.py
      - name: Compile patched backend
        run: python -m py_compile backend/app/main.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py
          git diff --cached --quiet && exit 0
          git commit -m "Masterplan: scope member identity per club"
          git push
