name: Style admin login page

on:
  push:
    branches:
      - feature/admin-dashboard-redesign-v1
    paths:
      - .github/workflows/style-admin-login.yml

permissions:
  contents: write

jobs:
  style-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-dashboard-redesign-v1
          fetch-depth: 0

      - name: Apply login styling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/static/admin.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* ===== Admin Login Redesign V1 ===== */'
          if marker in text:
              raise SystemExit('Login redesign already applied')

          css = r'''

    /* ===== Admin Login Redesign V1 ===== */
    body:has(#auth-view:not(.hidden)),
    body:has(#password-change-view:not(.hidden)) {
      min-height:100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(36,79,111,.22), transparent 34rem),
        radial-gradient(circle at 86% 10%, rgba(225,184,85,.09), transparent 28rem),
        linear-gradient(180deg,#071017 0%,#050b10 100%);
    }
    body:has(#auth-view:not(.hidden)) main,
    body:has(#password-change-view:not(.hidden)) main {
      min-height:calc(100vh - 76px);
      display:grid;
      place-items:center;
      padding:34px 20px;
    }
    #auth-view.auth-card,
    #password-change-view.auth-card {
      width:min(100%,460px);
      margin:0;
      padding:28px;
      border-radius:18px;
      border:1px solid rgba(225,184,85,.24);
      background:
        linear-gradient(180deg,rgba(15,27,36,.98),rgba(8,17,23,.98));
      box-shadow:0 28px 80px rgba(0,0,0,.42);
      position:relative;
      overflow:hidden;
    }
    #auth-view.auth-card::before,
    #password-change-view.auth-card::before {
      content:'';
      position:absolute;
      left:0; right:0; top:0;
      height:3px;
      background:linear-gradient(90deg,transparent,var(--admin-gold),transparent);
      opacity:.9;
    }
    .auth-brand {
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      margin:0 0 22px;
    }
    .auth-brand img {
      width:92px;
      height:92px;
      object-fit:contain;
      border-radius:20px;
      padding:8px;
      background:rgba(255,255,255,.035);
      border:1px solid rgba(225,184,85,.18);
      box-shadow:0 14px 34px rgba(0,0,0,.28);
    }
    .auth-brand strong {
      margin-top:13px;
      color:#f2d17f;
      font-size:19px;
      letter-spacing:.5px;
    }
    .auth-brand span {
      margin-top:4px;
      color:rgba(230,236,240,.58);
      font-size:12px;
    }
    #auth-view h2,
    #password-change-view h2 {
      margin:0 0 8px;
      text-align:center;
      color:#fff;
      font-size:24px;
    }
    #auth-view > p,
    #password-change-view > p {
      text-align:center;
      color:rgba(230,236,240,.62);
      font-size:13px;
      line-height:1.45;
      margin:0 0 18px;
    }
    #auth-view label,
    #password-change-view label {
      margin:12px 0 6px;
      font-size:12px;
      color:#dfe6ea;
    }
    #auth-view input,
    #auth-view select,
    #password-change-view input {
      min-height:44px;
      padding:10px 12px;
      border-radius:10px;
      background:#071017;
      border:1px solid rgba(255,255,255,.13);
      font-size:14px;
    }
    #auth-view input:focus,
    #auth-view select:focus,
    #password-change-view input:focus {
      border-color:rgba(225,184,85,.72);
      box-shadow:0 0 0 3px rgba(225,184,85,.11);
    }
    #auth-view .primary,
    #password-change-view .primary {
      width:100%;
      min-height:44px;
      margin-top:4px;
      border-radius:10px;
      background:linear-gradient(180deg,#a21c27,#7e131c);
      border:1px solid rgba(255,255,255,.08);
      font-size:14px;
      font-weight:900;
      box-shadow:0 10px 24px rgba(138,16,27,.18);
    }
    #auth-view .primary:hover,
    #password-change-view .primary:hover {
      filter:brightness(1.08);
      transform:translateY(-1px);
    }
    #auth-view .error,
    #password-change-view .error {
      margin:12px 0 0;
      padding:0;
      text-align:center;
      font-size:12px;
    }
    body:has(#auth-view:not(.hidden)) .admin-user-box,
    body:has(#password-change-view:not(.hidden)) .admin-user-box,
    body:has(#auth-view:not(.hidden)) #logout-button,
    body:has(#password-change-view:not(.hidden)) #logout-button {
      display:none;
    }
    body:has(#auth-view:not(.hidden)) #header-club-logo,
    body:has(#password-change-view:not(.hidden)) #header-club-logo {
      display:block !important;
    }
    @media (max-width:680px) {
      body:has(#auth-view:not(.hidden)) main,
      body:has(#password-change-view:not(.hidden)) main {
        padding:18px 10px;
      }
      #auth-view.auth-card,
      #password-change-view.auth-card {
        padding:22px 18px;
        border-radius:15px;
      }
      .auth-brand img { width:78px; height:78px; }
    }
          '''

          idx = text.rfind('</style>')
          if idx < 0:
              raise SystemExit('style closing tag not found')
          text = text[:idx] + css + '\n' + text[idx:]

          auth_marker = '<section id="auth-view" class="card auth-card">'
          if auth_marker in text and 'auth-brand' not in text[text.find(auth_marker):text.find(auth_marker)+500]:
              text = text.replace(
                  auth_marker,
                  auth_marker + '\n    <div class="auth-brand"><img src="/static/flapamamaku-icon.png" alt="App-Logo"><strong>Vereins-App Administration</strong><span>Sichere Vereinsverwaltung</span></div>',
                  1
              )

          pwd_marker = '<section id="password-change-view" class="card auth-card hidden">'
          if pwd_marker in text and 'auth-brand' not in text[text.find(pwd_marker):text.find(pwd_marker)+500]:
              text = text.replace(
                  pwd_marker,
                  pwd_marker + '\n    <div class="auth-brand"><img src="/static/flapamamaku-icon.png" alt="App-Logo"><strong>Vereins-App Administration</strong><span>Sichere Vereinsverwaltung</span></div>',
                  1
              )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit login redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/static/admin.html
          git rm .github/workflows/style-admin-login.yml
          git commit -m "feat: align admin login with dashboard design"
          git push origin feature/admin-dashboard-redesign-v1
