name: Fix admin logout header state

on:
  push:
    branches:
      - feature/admin-dashboard-redesign-v1
    paths:
      - .github/workflows/fix-admin-logout-header.yml

permissions:
  contents: write

jobs:
  fix-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-dashboard-redesign-v1
          fetch-depth: 0

      - name: Fix logged-out header state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/static/admin.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '<img id="header-club-logo" class="admin-header-logo no-image" alt="Vereinslogo">',
              '<img id="header-club-logo" class="admin-header-logo" src="/static/flapamamaku-icon.png" alt="App-Logo">'
          )
          text = text.replace(
              '<div class="admin-user-copy"><strong id="header-user-name">Admin</strong><span>Administration</span></div>',
              '<div class="admin-user-copy"><strong id="header-user-name"></strong><span>Administration</span></div>'
          )

          marker = '/* Logged-out header reset */'
          if marker not in text:
              script = r'''
<script>
/* Logged-out header reset */
(function () {
  const APP_LOGO = '/static/flapamamaku-icon.png';

  function resetLoggedOutHeader() {
    const userName = document.getElementById('header-user-name');
    if (userName) userName.textContent = '';

    const logo = document.getElementById('header-club-logo');
    if (logo) {
      logo.src = APP_LOGO;
      logo.alt = 'App-Logo';
      logo.classList.remove('no-image');
    }
  }

  const logoutButton = document.getElementById('logout-button');
  if (logoutButton) {
    logoutButton.addEventListener('click', () => {
      window.setTimeout(resetLoggedOutHeader, 0);
    });
  }

  const adminView = document.getElementById('admin-view');
  if (adminView) {
    const observer = new MutationObserver(() => {
      if (adminView.classList.contains('hidden')) resetLoggedOutHeader();
    });
    observer.observe(adminView, { attributes: true, attributeFilter: ['class'] });
    if (adminView.classList.contains('hidden')) resetLoggedOutHeader();
  } else {
    resetLoggedOutHeader();
  }
})();
</script>
'''
              idx = text.rfind('</body>')
              if idx < 0:
                  raise SystemExit('body closing tag not found')
              text = text[:idx] + script + '\n' + text[idx:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit header state fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/static/admin.html
          git rm .github/workflows/fix-admin-logout-header.yml
          git commit -m "fix: reset admin header after logout"
          git push origin feature/admin-dashboard-redesign-v1
