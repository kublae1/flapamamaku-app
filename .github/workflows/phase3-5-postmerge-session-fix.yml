name: Phase 3-5 Post-Merge Session Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase3-5-postmerge-session-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make core session schema tenant-safe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')

          old = '''            CREATE TABLE IF NOT EXISTS sessions (\n                token_hash TEXT PRIMARY KEY,\n                user_id INTEGER NOT NULL,\n                expires_at TEXT NOT NULL,\n                created_at TEXT NOT NULL,\n                FOREIGN KEY(user_id) REFERENCES users(id)\n            )\n'''
          new = '''            CREATE TABLE IF NOT EXISTS sessions (\n                token_hash TEXT PRIMARY KEY,\n                user_id INTEGER NOT NULL,\n                instance_id TEXT NOT NULL,\n                expires_at TEXT NOT NULL,\n                created_at TEXT NOT NULL,\n                FOREIGN KEY(user_id) REFERENCES users(id)\n            )\n'''
          if old not in text:
              raise SystemExit('sessions DDL anchor not found')
          text = text.replace(old, new, 1)

          old = '''        _ensure_column(db, "news", "image_data", "BLOB")\n'''
          new = '''        _ensure_column(db, "sessions", "instance_id", "TEXT NOT NULL DEFAULT ''")\n        db.execute(\n            "UPDATE sessions SET instance_id = ? WHERE instance_id = '' OR instance_id IS NULL",\n            (INSTANCE_ID,),\n        )\n\n        _ensure_column(db, "news", "image_data", "BLOB")\n'''
          if old not in text:
              raise SystemExit('session migration anchor not found')
          text = text.replace(old, new, 1)

          old = '''            INSERT INTO sessions (token_hash, user_id, expires_at, created_at)\n            VALUES (?, ?, ?, ?)\n'''
          new = '''            INSERT INTO sessions (token_hash, user_id, instance_id, expires_at, created_at)\n            VALUES (?, ?, ?, ?, ?)\n'''
          if old not in text:
              raise SystemExit('session insert anchor not found')
          text = text.replace(old, new, 1)

          old = '''                row["id"],\n                expires,\n                now_dt.isoformat(),\n'''
          new = '''                row["id"],\n                INSTANCE_ID,\n                expires,\n                now_dt.isoformat(),\n'''
          if old not in text:
              raise SystemExit('session values anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase3-5-postmerge-session-fix.yml
          git add backend/app/main.py
          git commit -m "Fix tenant-bound session schema after Phase 3-5 merge"
          git push origin HEAD:main
