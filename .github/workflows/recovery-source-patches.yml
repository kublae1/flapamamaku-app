name: Recovery Source Patches

on:
  push:
    branches:
      - recovery/masterplan-on-175c23b-20261006
    paths:
      - .github/workflows/recovery-source-patches.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/masterplan-on-175c23b-20261006
      - name: Patch guarded event registration to explicit 204
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/app/masterplan_extensions.py')
          text = path.read_text(encoding='utf-8')
          old = '            return registration_endpoint(row_id, user)\n'
          new = '            registration_endpoint(row_id, user)\n            return Response(status_code=204)\n'
          if old not in text:
              raise SystemExit('event registration return anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit source patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/masterplan_extensions.py
          git commit -m "Recovery: return HTTP 204 for guarded event registration"
          git push origin HEAD:recovery/masterplan-on-175c23b-20261006
