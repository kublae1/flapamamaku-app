name: Phase 3-5 Init Schema Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase3-5-init-schema-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Phase 4-5 initializer from init_db
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')
          old = '''        _apply_schema_migrations(db)\n        db.commit()\n\n\nasync def _snapshot_cleanup_loop() -> None:\n'''
          new = '''        _apply_schema_migrations(db)\n        db.commit()\n\n    # Keep direct init_db() callers at the same current schema as normal app startup.\n    phase45_initializer = getattr(app.state, "phase45_initializer", None)\n    if callable(phase45_initializer):\n        phase45_initializer()\n\n\nasync def _snapshot_cleanup_loop() -> None:\n'''
          if old not in text:
              raise SystemExit('init_db completion anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit backend correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py
          git commit -m "Apply Phase 4-5 schema initializer from init_db"
          git push origin HEAD:main
