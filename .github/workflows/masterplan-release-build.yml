name: Masterplan RC Release Build

on:
  push:
    branches:
      - feature/masterplan-on-recovered-20261006
      - release/masterplan-phase9-rc-20261007
    paths:
      - ".github/workflows/masterplan-release-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kublae1/flapamamaku-backend

jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable Phase-9 RC image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kublae1/flapamamaku-backend:masterplan-phase9-rc-sha-${{ github.sha }}
          build-args: |
            FLAPAMAMAKU_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch hardened signed Android build for this ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run masterplan-build-android-v8.yml --ref "${GITHUB_REF_NAME}"
          echo "Dispatched signed Android build for ${GITHUB_REF_NAME} at ${GITHUB_SHA}."
