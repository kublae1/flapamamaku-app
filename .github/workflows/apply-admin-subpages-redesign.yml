name: Apply admin UI follow-up

on:
  push:
    branches:
      - feature/admin-dashboard-redesign-v1
    paths:
      - tools/apply_admin_ui_followup.py
      - .github/workflows/apply-admin-subpages-redesign.yml

permissions:
  contents: write

jobs:
  apply-ui-followup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-dashboard-redesign-v1
          fetch-depth: 0

      - name: Apply admin UI follow-up
        shell: bash
        run: |
          if [ -f tools/apply_admin_ui_followup.py ]; then
            python tools/apply_admin_ui_followup.py
          else
            echo "No UI patch script present; nothing to apply."
          fi

      - name: Commit UI follow-up when changed
        shell: bash
        run: |
          if [ ! -f tools/apply_admin_ui_followup.py ] && git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/apply_admin_ui_followup.py
          git add -A backend/static/admin.html tools/apply_admin_ui_followup.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: centralize admin workspaces and fix login logo"
          git push origin feature/admin-dashboard-redesign-v1
