name: Apply admin subpages redesign

on:
  push:
    branches:
      - feature/admin-dashboard-redesign-v1
    paths:
      - .github/workflows/apply-admin-subpages-redesign.yml

permissions:
  contents: write

jobs:
  apply-subpages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-dashboard-redesign-v1
          fetch-depth: 0

      - name: Apply subpage UI refinement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/static/admin.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* ===== Admin Subpages Redesign V1 ===== */'
          if marker in text:
              raise SystemExit('Subpages redesign already applied')

          css = r'''

    /* ===== Admin Subpages Redesign V1 ===== */
    .panel:not(#dashboard) {
      padding-bottom:24px;
    }
    .panel:not(#dashboard) > .workspace-title,
    .panel:not(#dashboard) > .preview-heading {
      margin:0 0 12px;
      padding:14px 16px;
      border:1px solid rgba(225,184,85,.16);
      border-radius:12px;
      background:linear-gradient(135deg,rgba(225,184,85,.07),rgba(255,255,255,.018));
    }
    .panel:not(#dashboard) > .workspace-title h2,
    .panel:not(#dashboard) > .preview-heading h2 {
      color:#f2d17f;
      font-size:22px;
    }
    .panel:not(#dashboard) .grid {
      grid-template-columns:minmax(390px,.92fr) minmax(500px,1.28fr);
      gap:14px;
      align-items:start;
    }
    .panel:not(#dashboard) .card {
      margin-bottom:14px;
      padding:16px;
      border-radius:12px;
      background:linear-gradient(180deg,#0f1a22 0%,#0a141b 100%);
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 10px 30px rgba(0,0,0,.18);
    }
    .panel:not(#dashboard) form.card {
      position:relative;
      border-top-color:rgba(225,184,85,.45);
    }
    .panel:not(#dashboard) form.card::before {
      content:'';
      position:absolute;
      left:16px;
      right:16px;
      top:0;
      height:2px;
      border-radius:0 0 6px 6px;
      background:linear-gradient(90deg,var(--admin-gold),transparent 72%);
      opacity:.75;
    }
    .panel:not(#dashboard) .card h2 {
      margin:0 0 12px;
      font-size:18px;
      color:#f2d17f;
    }
    .panel:not(#dashboard) .card h3 {
      margin:14px 0 8px;
      font-size:15px;
      color:#f7e5b0;
    }
    .panel:not(#dashboard) label {
      margin:10px 0 5px;
      font-size:12px;
      color:#dfe6ea;
    }
    .panel:not(#dashboard) input,
    .panel:not(#dashboard) textarea,
    .panel:not(#dashboard) select {
      padding:9px 10px;
      border-radius:9px;
      background:#081118;
      border-color:rgba(255,255,255,.13);
      font-size:13px;
    }
    .panel:not(#dashboard) textarea {
      min-height:96px;
    }
    .panel:not(#dashboard) input:focus,
    .panel:not(#dashboard) textarea:focus,
    .panel:not(#dashboard) select:focus {
      border-color:rgba(225,184,85,.68);
      box-shadow:0 0 0 3px rgba(225,184,85,.10);
    }
    .panel:not(#dashboard) .primary {
      background:linear-gradient(180deg,#a21c27,#80131c);
      border:1px solid rgba(255,255,255,.08);
      border-radius:9px;
      padding:9px 14px;
      min-height:36px;
      font-size:12px;
    }
    .panel:not(#dashboard) button:not(.primary) {
      border-radius:8px;
    }
    .panel:not(#dashboard) .actions {
      gap:6px;
      margin-top:8px;
    }
    .panel:not(#dashboard) .actions button {
      padding:7px 10px;
      font-size:12px;
      background:#14222c;
    }
    .panel:not(#dashboard) .meta {
      font-size:12px;
      line-height:1.4;
      color:rgba(230,236,240,.62);
    }
    .panel:not(#dashboard) .entry,
    .panel:not(#dashboard) .content-list-card .entry {
      padding:10px 11px;
      margin:7px 0;
      border:1px solid rgba(255,255,255,.075);
      border-radius:9px;
      background:rgba(255,255,255,.025);
    }
    .panel:not(#dashboard) .entry:hover,
    .panel:not(#dashboard) .content-list-card .entry:hover {
      border-color:rgba(225,184,85,.22);
      background:rgba(225,184,85,.035);
    }
    .panel:not(#dashboard) .entry h3,
    .panel:not(#dashboard) .content-list-card .entry h3 {
      margin:0 0 4px;
      font-size:14px;
      color:#f4f7f8;
    }
    .panel:not(#dashboard) .section-switcher {
      gap:6px;
      margin:0 0 12px;
      padding:8px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:11px;
      background:rgba(8,17,24,.75);
    }
    .panel:not(#dashboard) .section-switcher button {
      padding:7px 10px;
      font-size:11px;
      border-radius:8px;
      background:#111e27;
    }
    .panel:not(#dashboard) .section-switcher button.active {
      background:linear-gradient(180deg,rgba(225,184,85,.30),rgba(225,184,85,.15));
      color:#fff2c8;
      border-color:rgba(225,184,85,.42);
    }
    .panel:not(#dashboard) .preview-heading {
      margin-bottom:10px;
    }
    .panel:not(#dashboard) .preview-heading h2 {
      font-size:18px;
    }
    .panel:not(#dashboard) .effective-rights-box {
      margin:14px 0;
      padding:12px;
      border-radius:10px;
      background:#0a141a;
    }
    .panel:not(#dashboard) .effective-rights-grid {
      gap:8px;
      margin-top:10px;
    }
    .panel:not(#dashboard) .effective-right {
      min-height:48px;
      padding:9px 10px;
      border-radius:8px;
      font-size:12px;
    }
    .panel:not(#dashboard) .permission-grid {
      gap:8px 10px;
    }
    #content.panel .phone-preview {
      width:min(100%,300px);
      border-width:6px;
      border-radius:26px;
      margin-bottom:14px;
    }
    #content.panel .phone-preview-top {
      padding:12px 10px 10px;
      font-size:17px;
    }
    #content.panel .phone-preview-copy {
      padding:12px 14px 15px;
    }
    #system.panel .card,
    #users.panel .card,
    #billing.panel .card,
    #push.panel .card {
      border-left:1px solid rgba(225,184,85,.13);
    }
    #system.panel #setup-status-card,
    #system.panel #onboarding-card {
      border-color:rgba(225,184,85,.22);
      background:linear-gradient(135deg,rgba(225,184,85,.065),#0a141b 55%);
    }
    #members.panel #members-list,
    #users.panel #users-list,
    #events.panel #events-list,
    #news.panel #news-list,
    #content.panel #content-list,
    #push.panel #push-history,
    #billing.panel #billing-club-list,
    #billing.panel #billing-invoice-list {
      max-height:calc(100vh - 245px);
      overflow:auto;
      padding-right:3px;
      scrollbar-width:thin;
      scrollbar-color:rgba(225,184,85,.36) transparent;
    }
    .panel:not(#dashboard) ::-webkit-scrollbar { width:8px; height:8px; }
    .panel:not(#dashboard) ::-webkit-scrollbar-thumb { background:rgba(225,184,85,.30); border-radius:10px; }
    .panel:not(#dashboard) ::-webkit-scrollbar-track { background:transparent; }

    @media (min-width:1400px) and (min-height:850px) {
      .panel:not(#dashboard).active {
        min-height:calc(100vh - 106px);
      }
      .panel:not(#dashboard).active > .grid {
        min-height:calc(100vh - 138px);
      }
    }
    @media (max-width:1180px) {
      .panel:not(#dashboard) .grid {
        grid-template-columns:minmax(320px,.9fr) minmax(0,1.1fr);
      }
    }
    @media (max-width:980px) {
      .panel:not(#dashboard) .grid {
        grid-template-columns:1fr;
      }
      #members.panel #members-list,
      #users.panel #users-list,
      #events.panel #events-list,
      #news.panel #news-list,
      #content.panel #content-list,
      #push.panel #push-history,
      #billing.panel #billing-club-list,
      #billing.panel #billing-invoice-list {
        max-height:none;
        overflow:visible;
      }
    }
    @media (max-width:680px) {
      .panel:not(#dashboard) .card { padding:13px; }
      .panel:not(#dashboard) > .workspace-title,
      .panel:not(#dashboard) > .preview-heading { padding:12px 13px; }
    }
          '''

          idx = text.rfind('</style>')
          if idx < 0:
              raise SystemExit('style closing tag not found')
          text = text[:idx] + css + '\n' + text[idx:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit refined subpages UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/static/admin.html
          git rm .github/workflows/apply-admin-subpages-redesign.yml
          git commit -m "feat: align admin subpages with dashboard design"
          git push origin feature/admin-dashboard-redesign-v1
