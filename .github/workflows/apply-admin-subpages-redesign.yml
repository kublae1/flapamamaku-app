name: Apply admin UI follow-up

on:
  push:
    branches:
      - feature/admin-dashboard-redesign-v1
    paths:
      - tools/apply_admin_ui_followup.py
      - .github/workflows/apply-admin-subpages-redesign.yml

permissions:
  contents: write

jobs:
  apply-ui-followup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-dashboard-redesign-v1
          fetch-depth: 0

      - name: Apply admin UI follow-up
        run: python tools/apply_admin_ui_followup.py

      - name: Commit UI follow-up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/static/admin.html
          git rm -f .github/workflows/style-admin-login.yml .github/workflows/fix-admin-logout-header.yml
          git rm -f tools/apply_admin_ui_followup.py
          git commit -m "feat: polish admin subpages login and logout state"
          git push origin feature/admin-dashboard-redesign-v1
