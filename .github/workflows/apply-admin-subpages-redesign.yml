name: Apply admin UI follow-up

on:
  push:
    branches:
      - feature/admin-dashboard-redesign-v1
    paths:
      - tools/apply_admin_ui_followup.py
      - tools/apply_admin_accordion_v3.py
      - tools/apply_admin_visual_media_v5.py
      - tools/apply_admin_authenticated_media_v6.py
      - tools/apply_admin_branding_layout_v7.py
      - tools/apply_admin_branding_layout_v8.py
      - tools/apply_admin_branding_cleanup_v9.py
      - tools/apply_admin_branding_users_v10.py
      - tools/apply_admin_branding_users_v11.py
      - tools/apply_dashboard_quick_alignment_v12.py
      - .github/workflows/apply-admin-subpages-redesign.yml

permissions:
  contents: write

jobs:
  apply-ui-followup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-dashboard-redesign-v1
          fetch-depth: 0

      - name: Apply admin UI follow-up
        shell: bash
        run: |
          if [ -f tools/apply_admin_ui_followup.py ]; then python tools/apply_admin_ui_followup.py; fi
          if [ -f tools/apply_admin_accordion_v3.py ]; then python tools/apply_admin_accordion_v3.py; fi
          if [ -f tools/apply_admin_visual_media_v5.py ]; then python tools/apply_admin_visual_media_v5.py; fi
          if [ -f tools/apply_admin_authenticated_media_v6.py ]; then python tools/apply_admin_authenticated_media_v6.py; fi
          if [ -f tools/apply_admin_branding_layout_v7.py ]; then python tools/apply_admin_branding_layout_v7.py; fi
          if [ -f tools/apply_admin_branding_layout_v8.py ]; then python tools/apply_admin_branding_layout_v8.py; fi
          if [ -f tools/apply_admin_branding_cleanup_v9.py ]; then python tools/apply_admin_branding_cleanup_v9.py; fi
          if [ -f tools/apply_admin_branding_users_v10.py ]; then python tools/apply_admin_branding_users_v10.py; fi
          if [ -f tools/apply_admin_branding_users_v11.py ]; then python tools/apply_admin_branding_users_v11.py; fi
          if [ -f tools/apply_dashboard_quick_alignment_v12.py ]; then python tools/apply_dashboard_quick_alignment_v12.py; fi

      - name: Commit UI follow-up when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/apply_admin_ui_followup.py tools/apply_admin_accordion_v3.py tools/apply_admin_visual_media_v5.py tools/apply_admin_authenticated_media_v6.py tools/apply_admin_branding_layout_v7.py tools/apply_admin_branding_layout_v8.py tools/apply_admin_branding_cleanup_v9.py tools/apply_admin_branding_users_v10.py tools/apply_admin_branding_users_v11.py tools/apply_dashboard_quick_alignment_v12.py
          git add -A backend/static/admin.html tools
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: align dashboard counters quick actions and colors"
          git push origin feature/admin-dashboard-redesign-v1
