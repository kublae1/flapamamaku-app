name: Masterplan Push Backend Hotfix

on:
  push:
    branches:
      - feature/masterplan-on-recovered-20261006
    paths:
      - "backend/**"
      - ".github/workflows/masterplan-push-backend-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kublae1/flapamamaku-backend

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile backend runtime
        run: |
          python3 -m py_compile backend/app/main.py backend/app/runtime.py backend/app/push_runtime.py backend/app/masterplan_extensions.py
      - name: Test legacy push trigger cleanup
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          p = Path('/tmp/push-trigger-test.db')
          if p.exists(): p.unlink()
          db = sqlite3.connect(p)
          db.executescript('''
          CREATE TABLE push_tokens(id INTEGER PRIMARY KEY, club_id INTEGER, token TEXT);
          CREATE TRIGGER legacy_push_guard BEFORE INSERT ON push_tokens
          WHEN NEW.club_id != 999
          BEGIN SELECT RAISE(ABORT, 'wrong club_id'); END;
          CREATE TRIGGER keep_push_guard AFTER INSERT ON push_tokens
          BEGIN SELECT 1; END;
          ''')
          rows = db.execute("SELECT name,sql FROM sqlite_master WHERE type='trigger' AND tbl_name='push_tokens'").fetchall()
          for name, sql in rows:
              if 'wrong club_id' in (sql or '').lower():
                  db.execute(f'DROP TRIGGER IF EXISTS "{name.replace(chr(34), chr(34)*2)}"')
          db.commit()
          names = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='trigger' AND tbl_name='push_tokens'")}
          assert 'legacy_push_guard' not in names
          assert 'keep_push_guard' in names
          db.close()
          print('legacy push trigger cleanup: ok')
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kublae1/flapamamaku-backend:masterplan-push-hotfix-sha-${{ github.sha }}
          build-args: |
            FLAPAMAMAKU_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
