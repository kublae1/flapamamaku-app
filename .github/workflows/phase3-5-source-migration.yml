name: Phase 3-5 Source Migration

on:
  push:
    branches:
      - feature/masterplan-phase3-5-20261004

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/masterplan-phase3-5-20261004

      - name: Apply Phase 3-5 source migration
        run: python3 tools/phase3_5_source_migration.py

      - name: Commit migrated sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py backend/app/phase45.py backend/static/admin.html lib/data/api_service.dart lib/models/app_data.dart pubspec.yaml
          git commit -m "Apply Phase 3-5 canonical data and tenant hardening"
          git push origin HEAD:feature/masterplan-phase3-5-20261004
