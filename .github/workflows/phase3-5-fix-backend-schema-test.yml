name: Phase 3-5 Fix Backend Schema Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase3-5-fix-backend-schema-test.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align backend schema-version regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/test-backend.yml')
          text = path.read_text(encoding='utf-8')
          old = '          assert CURRENT_SCHEMA_VERSION == 8\n'
          new = '          assert CURRENT_SCHEMA_VERSION == 10\n'
          if old not in text:
              raise SystemExit('schema-version test anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase3-5-fix-backend-schema-test.yml
          git add .github/workflows/test-backend.yml
          git commit -m "Align backend regression test with schema version 10"
          git push origin HEAD:main
