name: Public HTTPS Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ feature/public-smoke-v1 ]
    paths:
      - ".github/workflows/public-smoke.yml"
      - "backend/PUBLIC_DEPLOYMENT.md"

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PUBLIC_API_BASE_URL: ${{ vars.WHITE_LABEL_API_BASE_URL || vars.FLAPAMAMAKU_API_BASE_URL || 'https://flapamamaku.kublaecloud.synology.me' }}

    steps:
      - name: Validate configured public URL
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ["PUBLIC_API_BASE_URL"].rstrip("/")
          parsed = urlparse(url)
          assert parsed.scheme == "https", "Public API URL must use HTTPS"
          assert parsed.netloc, "Public API URL must contain a hostname"
          assert not parsed.path or parsed.path == "/", "Public API URL must not contain an API path"
          print(f"Testing public API: {url}")
          PY

      - name: Test HTTPS health endpoint
        shell: bash
        run: |
          BASE="${PUBLIC_API_BASE_URL%/}"
          curl --fail --silent --show-error             --connect-timeout 15             --max-time 30             -D /tmp/headers.txt             -o /tmp/health.json             "$BASE/api/health"

          cat /tmp/health.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/health.json").read_text())
          assert payload.get("status") == "ok", payload
          assert payload.get("version"), payload
          assert payload.get("build_sha"), payload
          assert isinstance(payload.get("schema_version"), int), payload
          print("health endpoint ok")
          PY

      - name: Verify public security headers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          raw = Path("/tmp/headers.txt").read_text().lower()
          required = {
              "strict-transport-security:": "HSTS",
              "x-content-type-options: nosniff": "nosniff",
              "x-frame-options: deny": "frame protection",
              "referrer-policy: no-referrer": "referrer policy",
          }
          missing = [label for header, label in required.items() if header not in raw]
          if missing:
              raise SystemExit("Missing security headers: " + ", ".join(missing))
          print("security headers ok")
          PY

      - name: Verify production API docs are disabled
        shell: bash
        run: |
          BASE="${PUBLIC_API_BASE_URL%/}"
          CODE=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}"             --connect-timeout 15 --max-time 30 "$BASE/api/docs")
          if [ "$CODE" != "404" ]; then
            echo "::error::Expected /api/docs to return 404 in production, got $CODE"
            exit 1
          fi
          echo "production docs disabled"

      - name: Verify authentication endpoint is reachable
        shell: bash
        run: |
          BASE="${PUBLIC_API_BASE_URL%/}"
          curl --fail --silent --show-error             --connect-timeout 15             --max-time 30             "$BASE/api/auth/status" > /tmp/auth-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/auth-status.json").read_text())
          assert isinstance(payload.get("bootstrap_required"), bool), payload
          print("authentication endpoint ok")
          PY
