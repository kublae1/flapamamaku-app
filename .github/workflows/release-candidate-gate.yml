name: FLAPAMAMAKU Release Candidate Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/masterplan-on-recovered-20261006
      - release/masterplan-phase9-rc-20261007
    paths:
      - "backend/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "config/white-label/flapamamaku.json"
      - ".github/workflows/masterplan-build-android-v8.yml"
      - ".github/workflows/masterplan-release-build.yml"
      - ".github/workflows/release-candidate-gate.yml"

jobs:
  release-candidate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate FLAPAMAMAKU release profile
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          path = Path("config/white-label/flapamamaku.json")
          data = json.loads(path.read_text())
          required = {
              "id", "instance_id", "app_name", "app_subtitle",
              "api_base_url", "app_icon_url", "allow_server_change",
          }
          missing = sorted(required - set(data))
          assert not missing, f"Missing profile fields: {missing}"
          assert data["id"] == "flapamamaku"
          assert data["instance_id"] == "flapamamaku"
          assert str(data["app_name"]).strip() == "FLAPAMAMAKU"
          assert isinstance(data["allow_server_change"], bool)
          url = str(data["api_base_url"]).rstrip("/")
          parsed = urlparse(url)
          assert parsed.scheme == "https" and parsed.netloc
          assert parsed.path in ("", "/")
          assert not parsed.query and not parsed.fragment
          print(f"Profile OK: {url}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile and initialize runtime backend
        working-directory: backend
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-release-candidate.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-release-candidate-backups
          FLAPAMAMAKU_INSTANCE_ID: flapamamaku
          FLAPAMAMAKU_PLATFORM_DB: /tmp/flapamamaku-release-candidate-platform.db
        run: |
          rm -f /tmp/flapamamaku-release-candidate.db /tmp/flapamamaku-release-candidate-platform.db
          rm -rf /tmp/flapamamaku-release-candidate-backups
          python -m py_compile app/main.py app/runtime.py app/masterplan_extensions.py app/platform.py app/platform_store.py app/platform_runtime.py app/push_runtime.py
          python - <<'PY'
          from app import main as main_app
          from app import masterplan_extensions
          from app.runtime import app

          main_app.init_db()
          masterplan_extensions.init_masterplan_schema()
          status = main_app.health()
          assert main_app.INSTANCE_ID == "flapamamaku"
          assert status["instance_id"] == "flapamamaku"
          assert status["schema_version"] == main_app.CURRENT_SCHEMA_VERSION
          assert app is main_app.app
          print(
              f"Runtime backend OK: API {main_app.API_VERSION}, "
              f"schema {main_app.CURRENT_SCHEMA_VERSION}"
          )
          PY

      - name: Verify public backend identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          profile = json.loads(Path("config/white-label/flapamamaku.json").read_text())
          base = profile["api_base_url"].rstrip("/")
          raw = subprocess.check_output(
              ["curl", "--fail", "--silent", "--show-error",
               "--connect-timeout", "15", "--max-time", "30",
               f"{base}/api/health"],
              text=True,
          )
          payload = json.loads(raw)
          assert payload.get("status") == "ok", payload
          assert payload.get("instance_id") == "flapamamaku", payload
          assert payload.get("build_sha"), payload
          print(
              f"Public backend OK: API {payload.get('version')} / "
              f"{payload.get('build_sha')}"
          )
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "No Flutter test files found; analyze completed."
          fi

      - name: Verify hardened Android release inputs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/masterplan-build-android-v8.yml").read_text()
          required = [
              "ANDROID_APPLICATION_ID: ch.flapamamaku.app",
              "Configure native Firebase Android resources",
              "Configure permanent release signing",
              "FLAPAMAMAKU_ANDROID_KEYSTORE_BASE64",
              "POST_NOTIFICATIONS",
              "USE_BIOMETRIC",
              "FlutterFragmentActivity",
              "flutter build apk --release",
              "APP_BUILD_NUMBER",
              "APKSIGNER",
              "verify --print-certs",
          ]
          missing = [item for item in required if item not in workflow]
          if missing:
              raise SystemExit(
                  "Hardened Android release workflow incomplete: " + ", ".join(missing)
              )
          print("Hardened Android release workflow inputs OK")
          PY

      - name: Release candidate summary
        run: |
          echo "FLAPAMAMAKU release candidate gate passed."
          echo "Runtime backend, Flutter and hardened Android release path are aligned."
