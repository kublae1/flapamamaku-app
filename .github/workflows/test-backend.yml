name: Test Backend

on:
  workflow_dispatch:
  push:
    branches: [main, feature/backup-restore-v1, feature/security-hardening-v1, feature/public-readiness-v1, feature/club-instance-identity-v1, feature/neutral-admin-ui-v1, feature/autonomous-onboarding-v1, feature/club-setup-status-v1, feature/backup-instance-protection-v1, feature/instance-isolation-visibility-v1, feature/settings-permission-v1, feature/settings-permission-integration-v1, feature/settings-permission-ui-v1, feature/settings-permission-summary-v1, feature/club-manager-role-v1, feature/multi-tenant-package1, feature/multi-tenant-package2, feature/multi-tenant-package3, feature/multi-tenant-package4, feature/multi-tenant-package5, feature/multi-tenant-package6, feature/multi-tenant-package7, feature/multi-tenant-package8, feature/multi-tenant-package9, feature/multi-tenant-package10, feature/white-label-onboarding-v1, feature/white-label-onboarding-v2, feature/club-billing-suspension-v1, feature/club-billing-admin-ui-v1, feature/club-billing-pdf-grace-v1, feature/final-release-validation-v1, feature/image-upload-optimization-v1, feature/superadmin-resilience-v1, feature/gallery-snapshot-retention-v1 ]
    paths:
      - "backend/**"
      - ".github/workflows/test-backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt httpx

      - name: Compile backend
        run: python -m py_compile app/main.py

      - name: Initialize database
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-test.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-backups
        run: python -c "from app.main import init_db; init_db(); print('database ok')"

      - name: Test multi-tenant clubs foundation
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-tenant-foundation.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-tenant-foundation-backups
        run: |
          rm -f /tmp/flapamamaku-tenant-foundation.db
          rm -rf /tmp/flapamamaku-tenant-foundation-backups
          python - <<'PY'
          from app.main import CURRENT_SCHEMA_VERSION, connect, init_db

          init_db()

          with connect() as db:
              tables = {
                  row["name"]
                  for row in db.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  ).fetchall()
              }
              assert "clubs" in tables

              columns = {
                  row["name"]
                  for row in db.execute("PRAGMA table_info(clubs)").fetchall()
              }
              required = {
                  "id", "slug", "name", "short_name", "active", "logo",
                  "primary_color", "secondary_color", "created_at", "updated_at",
                  "description", "website", "email", "phone", "address",
                  "city", "country", "app_title", "welcome_text",
              }
              assert required.issubset(columns), required - columns

              club = db.execute(
                  "SELECT * FROM clubs WHERE slug = ?",
                  ("flapamamaku",),
              ).fetchone()
              assert club is not None
              assert club["id"] == 1
              assert club["name"] == "FLAPAMAMAKU"
              assert club["short_name"] == "FLAPAMAMAKU"
              assert club["active"] == 1

              migration = db.execute(
                  "SELECT name FROM schema_migrations WHERE version = 9"
              ).fetchone()
              assert migration is not None
              assert migration["name"] == "multi-tenant-clubs-foundation"
              assert CURRENT_SCHEMA_VERSION == 19

              member = db.execute(
                  """
                  INSERT INTO members (name, role, since, created_at)
                  VALUES (?, ?, ?, ?)
                  """,
                  ("Paket 1 Bestand", "Mitglied", "2026", "2026-09-30T00:00:00+00:00"),
              )
              member_id = member.lastrowid
              news = db.execute(
                  """
                  INSERT INTO news (title, text, date, created_at)
                  VALUES (?, ?, ?, ?)
                  """,
                  ("Paket 1 Bestand", "Unverändert", "30.09.2026", "2026-09-30T00:00:00+00:00"),
              )
              news_id = news.lastrowid
              db.commit()

          init_db()

          with connect() as db:
              assert db.execute("SELECT COUNT(*) FROM clubs").fetchone()[0] == 1
              assert db.execute(
                  "SELECT id FROM members WHERE name = ?",
                  ("Paket 1 Bestand",),
              ).fetchone()[0] == member_id
              assert db.execute(
                  "SELECT id FROM news WHERE title = ?",
                  ("Paket 1 Bestand",),
              ).fetchone()[0] == news_id

          print("multi-tenant clubs foundation ok")
          PY

      - name: Test FLAPAMAMAKU club data migration
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-package2-migration.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-package2-backups
        run: |
          rm -f /tmp/flapamamaku-package2-migration.db
          rm -rf /tmp/flapamamaku-package2-backups
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db_path = Path("/tmp/flapamamaku-package2-migration.db")
          with sqlite3.connect(db_path) as db:
              db.executescript(
                  """
                  CREATE TABLE news (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      title TEXT NOT NULL,
                      text TEXT NOT NULL,
                      date TEXT NOT NULL,
                      image_url TEXT NOT NULL DEFAULT '',
                      image_data BLOB,
                      image_mime TEXT NOT NULL DEFAULT '',
                      sort_order INTEGER NOT NULL DEFAULT 0,
                      created_at TEXT NOT NULL
                  );
                  CREATE TABLE events (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      event_date TEXT NOT NULL DEFAULT '',
                      day TEXT NOT NULL,
                      month TEXT NOT NULL,
                      title TEXT NOT NULL,
                      location TEXT NOT NULL DEFAULT '',
                      time TEXT NOT NULL DEFAULT '',
                      created_at TEXT NOT NULL
                  );
                  CREATE TABLE members (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      name TEXT NOT NULL,
                      role TEXT NOT NULL DEFAULT 'Präsident',
                      since TEXT NOT NULL DEFAULT '',
                      birth_date TEXT NOT NULL DEFAULT '',
                      status TEXT NOT NULL DEFAULT 'Aktiv',
                      member_group TEXT NOT NULL DEFAULT '',
                      engagement TEXT NOT NULL DEFAULT '',
                      partner_name TEXT NOT NULL DEFAULT '',
                      phone_mobile TEXT NOT NULL DEFAULT '',
                      phone_private TEXT NOT NULL DEFAULT '',
                      phone_work TEXT NOT NULL DEFAULT '',
                      email TEXT NOT NULL DEFAULT '',
                      address TEXT NOT NULL DEFAULT '',
                      occupation TEXT NOT NULL DEFAULT '',
                      employer TEXT NOT NULL DEFAULT '',
                      employer_url TEXT NOT NULL DEFAULT '',
                      sort_order INTEGER NOT NULL DEFAULT 0,
                      photo_data BLOB,
                      photo_mime TEXT NOT NULL DEFAULT '',
                      created_at TEXT NOT NULL
                  );
                  CREATE TABLE app_config (
                      id INTEGER PRIMARY KEY CHECK (id = 1),
                      app_name TEXT NOT NULL DEFAULT 'FLAPAMAMAKU',
                      app_subtitle TEXT NOT NULL DEFAULT 'Fasnachtsgruppe Luzern',
                      primary_color TEXT NOT NULL DEFAULT '#8A101B',
                      updated_at TEXT NOT NULL
                  );
                  """
              )
              db.execute(
                  "INSERT INTO news (id,title,text,date,created_at) VALUES (41,?,?,?,?)",
                  ("Alt News", "Bestehend", "30.09.2026", "2026-09-30T00:00:00+00:00"),
              )
              db.execute(
                  "INSERT INTO events (id,day,month,title,created_at) VALUES (51,?,?,?,?)",
                  ("30", "09", "Alt Termin", "2026-09-30T00:00:00+00:00"),
              )
              db.execute(
                  "INSERT INTO members (id,name,role,since,created_at) VALUES (61,?,?,?,?)",
                  ("Alt Mitglied", "Mitglied", "2020", "2026-09-30T00:00:00+00:00"),
              )
              db.execute(
                  "INSERT INTO app_config (id,app_name,app_subtitle,primary_color,updated_at) VALUES (1,?,?,?,?)",
                  ("FLAPAMAMAKU", "Fasnachtsgruppe Luzern", "#8A101B", "2026-09-30T00:00:00+00:00"),
              )
              db.commit()

          from app.main import CURRENT_SCHEMA_VERSION, connect, init_db
          init_db()

          with connect() as db:
              assert CURRENT_SCHEMA_VERSION == 19
              assert db.execute("SELECT id, club_id FROM news WHERE id = 41").fetchone()[:] == (41, 1)
              assert db.execute("SELECT id, club_id FROM events WHERE id = 51").fetchone()[:] == (51, 1)
              assert db.execute("SELECT id, club_id FROM members WHERE id = 61").fetchone()[:] == (61, 1)

              migration = db.execute(
                  "SELECT name FROM schema_migrations WHERE version = 10"
              ).fetchone()
              assert migration is not None
              assert migration["name"] == "flapamamaku-club-data-migration"

              club = db.execute(
                  "SELECT id, slug, name, primary_color FROM clubs WHERE id = 1"
              ).fetchone()
              assert club["slug"] == "flapamamaku"
              assert club["name"] == "FLAPAMAMAKU"
              assert club["primary_color"] == "#8A101B"

              for table in (
                  "news", "events", "members", "app_config", "member_filters",
                  "content_items", "content_images", "gallery_snapshots",
                  "push_notifications", "member_filter_links", "poll_votes",
                  "poll_suggestions", "push_deliveries", "event_registrations",
              ):
                  columns = {
                      row["name"]
                      for row in db.execute(f"PRAGMA table_info({table})").fetchall()
                  }
                  assert "club_id" in columns, table

          print("FLAPAMAMAKU package 2 migration ok")
          PY

      - name: Test package 3 API tenant isolation
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-package3-isolation.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-package3-backups
          FLAPAMAMAKU_INSTANCE_ID: flapamamaku
        run: |
          rm -f /tmp/flapamamaku-package3-isolation.db
          rm -rf /tmp/flapamamaku-package3-backups
          python - <<'PY'
          from fastapi import HTTPException
          from app.main import (
              NewsPayload,
              ContentPayload,
              connect,
              create_row,
              delete_content,
              get_content,
              init_db,
              list_rows,
              update_row,
          )

          init_db()
          with connect() as db:
              now = "2026-09-30T00:00:00+00:00"
              cursor = db.execute(
                  """
                  INSERT INTO clubs (
                      slug, name, short_name, active,
                      primary_color, secondary_color,
                      created_at, updated_at
                  ) VALUES (?, ?, ?, 1, '#000000', '#FFFFFF', ?, ?)
                  """,
                  ("testverein", "Testverein", "Testverein", now, now),
              )
              foreign_club_id = cursor.lastrowid
              db.execute(
                  """
                  INSERT INTO news (
                      title, text, date, sort_order, created_at, club_id
                  ) VALUES (?, ?, ?, 1, ?, ?)
                  """,
                  ("Fremde News", "Nur Testverein", "30.09.2026", now, foreign_club_id),
              )
              foreign_news_id = db.execute(
                  "SELECT id FROM news WHERE title = 'Fremde News'"
              ).fetchone()[0]
              db.execute(
                  """
                  INSERT INTO content_items (
                      section, title, text, link_url, sort_order, created_at, club_id
                  ) VALUES ('gallery', ?, '', '', 1, ?, ?)
                  """,
                  ("Fremder Inhalt", now, foreign_club_id),
              )
              foreign_content_id = db.execute(
                  "SELECT id FROM content_items WHERE title = 'Fremder Inhalt'"
              ).fetchone()[0]
              db.commit()

          own = create_row(
              "news",
              NewsPayload(title="Eigene News", text="FLAPAMAMAKU", date="30.09.2026"),
          )
          rows = list_rows("news")
          titles = {row["title"] for row in rows}
          assert "Eigene News" in titles
          assert "Fremde News" not in titles
          assert own["club_id"] == 1

          try:
              update_row(
                  "news",
                  foreign_news_id,
                  NewsPayload(title="Manipuliert", text="Nein", date="30.09.2026"),
              )
              raise AssertionError("foreign news update was accepted")
          except HTTPException as exc:
              assert exc.status_code == 404

          fake_user = {
              "id": 1,
              "can_photos": True,
              "can_documents": True,
              "can_polls": True,
              "can_links": True,
              "can_contact": True,
              "can_about": True,
          }
          content = get_content(section="gallery", user=fake_user)
          assert all(item.get("title") != "Fremder Inhalt" for item in content)

          try:
              delete_content(foreign_content_id, user=fake_user)
              raise AssertionError("foreign content delete was accepted")
          except HTTPException as exc:
              assert exc.status_code == 404

          with connect() as db:
              assert db.execute(
                  "SELECT COUNT(*) FROM news WHERE id = ?",
                  (foreign_news_id,),
              ).fetchone()[0] == 1
              assert db.execute(
                  "SELECT COUNT(*) FROM content_items WHERE id = ?",
                  (foreign_content_id,),
              ).fetchone()[0] == 1

          print("package 3 API tenant isolation ok")
          PY

      - name: Test package 4 user club memberships
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-package4-users.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-package4-backups
          FLAPAMAMAKU_INSTANCE_ID: flapamamaku
        run: |
          rm -f /tmp/flapamamaku-package4-users.db
          rm -rf /tmp/flapamamaku-package4-backups
          python - <<'PY'
          from datetime import datetime, timezone
          from fastapi import HTTPException
          from starlette.requests import Request
          from app.main import (
              CURRENT_SCHEMA_VERSION,
              LoginPayload,
              _hash_password,
              connect,
              current_user,
              init_db,
              login,
          )

          init_db()
          assert CURRENT_SCHEMA_VERSION == 19

          with connect() as db:
              now = datetime.now(timezone.utc).isoformat()
              password_hash, salt = _hash_password("Geheim123!")
              cursor = db.execute(
                  """
                  INSERT INTO users (
                      username, password_hash, password_salt, active,
                      role_key, permission_overrides, created_at
                  ) VALUES (?, ?, ?, 1, 'member', '{}', ?)
                  """,
                  ("package4-user", password_hash, salt, now),
              )
              user_id = cursor.lastrowid
              db.execute(
                  """
                  INSERT INTO user_clubs (
                      user_id, club_id, role, active, created_at, updated_at
                  ) VALUES (?, 1, 'member', 1, ?, ?)
                  """,
                  (user_id, now, now),
              )
              db.execute(
                  """
                  INSERT INTO clubs (
                      slug, name, short_name, active,
                      primary_color, secondary_color, created_at, updated_at
                  ) VALUES (
                      'testverein', 'Testverein', 'Testverein', 1,
                      '#000000', '#FFFFFF', ?, ?
                  )
                  """,
                  (now, now),
              )
              foreign_club_id = db.execute(
                  "SELECT id FROM clubs WHERE slug = 'testverein'"
              ).fetchone()[0]
              db.commit()

          scope = {
              "type": "http",
              "method": "POST",
              "path": "/api/auth/login",
              "headers": [],
              "client": ("127.0.0.1", 12345),
              "server": ("testserver", 80),
              "scheme": "http",
              "query_string": b"",
          }
          request = Request(scope)
          result = login(
              request,
              LoginPayload(username="package4-user", password="Geheim123!"),
          )
          assert result["user"]["current_club_id"] == 1
          assert result["user"]["club_role"] == "member"

          with connect() as db:
              db.execute(
                  """
                  UPDATE user_clubs
                  SET active = 0
                  WHERE user_id = ? AND club_id = 1
                  """,
                  (user_id,),
              )
              db.execute(
                  """
                  INSERT INTO user_clubs (
                      user_id, club_id, role, active, created_at, updated_at
                  ) VALUES (?, ?, 'member', 1, ?, ?)
                  """,
                  (user_id, foreign_club_id, now, now),
              )
              db.commit()

          moved = login(
              request,
              LoginPayload(username="package4-user", password="Geheim123!"),
          )
          assert moved["user"]["current_club_id"] == foreign_club_id
          assert moved["user"]["club_role"] == "member"
          assert moved["requires_club_selection"] is False
          assert [club["id"] for club in moved["clubs"]] == [foreign_club_id]

          print("package 4 user club memberships ok")
          PY

      - name: Test package 5 club configuration
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-package5-config.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-package5-backups
          FLAPAMAMAKU_INSTANCE_ID: flapamamaku
        run: |
          rm -f /tmp/flapamamaku-package5-config.db
          rm -rf /tmp/flapamamaku-package5-backups
          python - <<'PY'
          from datetime import datetime, timezone
          from app.main import (
              AppConfigPayload,
              _app_config,
              connect,
              init_db,
              put_app_config,
          )

          init_db()
          initial = _app_config()
          assert initial["club_id"] == 1
          assert initial["slug"] == "flapamamaku"
          assert initial["app_name"] == "FLAPAMAMAKU"
          assert initial["primary_color"] == "#8A101B"

          now = datetime.now(timezone.utc).isoformat()
          with connect() as db:
              db.execute(
                  """
                  INSERT INTO clubs (
                      slug, name, short_name, active,
                      primary_color, secondary_color,
                      created_at, updated_at
                  ) VALUES (
                      'fremdverein', 'Fremdverein', 'Fremd', 1,
                      '#111111', '#EEEEEE', ?, ?
                  )
                  """,
                  (now, now),
              )
              foreign_id = db.execute(
                  "SELECT id FROM clubs WHERE slug = 'fremdverein'"
              ).fetchone()[0]
              db.commit()

          updated = put_app_config(
              AppConfigPayload(
                  app_name="FLAPAMAMAKU",
                  short_name="FLAPA",
                  app_subtitle="Fasnachtsgruppe Luzern",
                  primary_color="#8A101B",
                  secondary_color="#FAFAFA",
                  club_description="Referenzverein",
                  website_url="https://example.invalid",
                  contact_email="kontakt@example.invalid",
                  contact_phone="+41 00 000 00 00",
                  club_address="Luzern",
                  city="Luzern",
                  country="CH",
                  app_title="FLAPAMAMAKU",
                  welcome_text="Willkommen",
              ),
              _={"id": 1},
          )

          assert updated["app_name"] == "FLAPAMAMAKU"
          assert updated["short_name"] == "FLAPA"
          assert updated["secondary_color"] == "#FAFAFA"
          assert updated["club_description"] == "Referenzverein"
          assert updated["city"] == "Luzern"
          assert updated["country"] == "CH"

          with connect() as db:
              own = db.execute(
                  "SELECT * FROM clubs WHERE id = 1"
              ).fetchone()
              foreign = db.execute(
                  "SELECT * FROM clubs WHERE id = ?",
                  (foreign_id,),
              ).fetchone()

              assert own["short_name"] == "FLAPA"
              assert own["email"] == "kontakt@example.invalid"
              assert own["secondary_color"] == "#FAFAFA"
              assert foreign["name"] == "Fremdverein"
              assert foreign["primary_color"] == "#111111"
              assert foreign["secondary_color"] == "#EEEEEE"

          print("package 5 club configuration ok")
          PY

      - name: Test package 6 club feature flags
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-package6-features.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-package6-backups
          FLAPAMAMAKU_INSTANCE_ID: flapamamaku
        run: |
          rm -f /tmp/flapamamaku-package6-features.db
          rm -rf /tmp/flapamamaku-package6-backups
          python - <<'PY'
          from fastapi import HTTPException
          from app.main import (
              CLUB_FEATURE_DEFAULTS,
              CURRENT_SCHEMA_VERSION,
              _app_config,
              _club_feature_enabled,
              _club_features,
              _set_club_features,
              connect,
              init_db,
              list_rows,
          )

          init_db()
          assert CURRENT_SCHEMA_VERSION == 19

          with connect() as db:
              features = _club_features(db, 1)
              assert set(CLUB_FEATURE_DEFAULTS).issubset(features)
              assert all(features[key]["enabled"] for key in CLUB_FEATURE_DEFAULTS)
              assert features["sujet_next"]["label"] == "Sujet nächstes Jahr"
              assert features["sujet_archive"]["label"] == "Vergangene Sujet"

              _set_club_features(
                  db,
                  1,
                  {
                      "news": False,
                      "gallery": False,
                      "sujet_next": False,
                  },
                  {"sujet_next": "Eigenes Sujet"},
              )
              db.commit()

              assert _club_feature_enabled(db, "news", 1) is False
              assert _club_feature_enabled(db, "gallery", 1) is False
              assert _club_feature_enabled(db, "events", 1) is True

          config = _app_config()
          assert config["show_news"] is False
          assert config["show_gallery"] is False
          assert config["show_sujet"] is False
          assert config["label_sujet"] == "Eigenes Sujet"
          assert config["show_events"] is True
          assert config["show_members"] is True

          try:
              list_rows("news")
              raise AssertionError("disabled news module remained API-accessible")
          except HTTPException as exc:
              assert exc.status_code == 404

          events = list_rows("events")
          assert isinstance(events, list)

          with connect() as db:
              _set_club_features(db, 1, {"news": True, "gallery": True, "sujet_next": True})
              db.commit()

          assert _app_config()["show_news"] is True
          print("package 6 club feature flags ok")
          PY

