      - name: Test login rate limit and session expiry
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-security-test.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-security-backups
          FLAPAMAMAKU_LOGIN_RATE_MAX_ATTEMPTS: "3"
          FLAPAMAMAKU_LOGIN_RATE_WINDOW_SECONDS: "600"
          FLAPAMAMAKU_LOGIN_LOCKOUT_SECONDS: "60"
          FLAPAMAMAKU_SESSION_LIFETIME_DAYS: "30"
        run: |
          rm -f /tmp/flapamamaku-security-test.db
          python - <<'PY'
          import sqlite3
          from datetime import datetime, timezone
          from fastapi import HTTPException
          from starlette.requests import Request
          from app.main import (
              DB_PATH,
              LoginPayload,
              _check_login_rate_limit,
              _hash_password,
              _login_rate_key,
              _record_login_failure,
              _token_hash,
              current_user,
              init_db,
              login,
          )

          init_db()
          password_hash, salt = _hash_password("Geheim123!")
          with sqlite3.connect(DB_PATH) as db:
              cursor = db.execute(
                  """
                  INSERT INTO users (
                      username, password_hash, password_salt, active,
                      role_key, permission_overrides, created_at
                  ) VALUES (?, ?, ?, 1, 'member', '{}', ?)
                  """,
                  (
                      "security-test",
                      password_hash,
                      salt,
                      datetime.now(timezone.utc).isoformat(),
                  ),
              )
              user_id = cursor.lastrowid
              now = datetime.now(timezone.utc).isoformat()
              db.execute(
                  """
                  INSERT INTO user_clubs (
                      user_id, club_id, role, active, created_at, updated_at
                  ) VALUES (?, 1, 'member', 1, ?, ?)
                  """,
                  (user_id, now, now),
              )
              db.commit()

          scope = {
              "type": "http",
              "method": "POST",
              "path": "/api/auth/login",
              "headers": [],
              "client": ("127.0.0.1", 12345),
              "server": ("testserver", 80),
              "scheme": "http",
              "query_string": b"",
          }
          request = Request(scope)
          key = _login_rate_key(request, "security-test")

          for _ in range(3):
              _record_login_failure(key)

          try:
              _check_login_rate_limit(key)
              raise AssertionError("rate limit was not enforced")
          except HTTPException as exc:
              assert exc.status_code == 429
              assert "Retry-After" in (exc.headers or {})

          from app import main as main_module
          main_module._clear_login_failures(key)
          result = login(
              request,
              LoginPayload(username="security-test", password="Geheim123!"),
          )
          assert result["token"]
          expires = datetime.fromisoformat(result["expires_at"])
          remaining_days = (expires - datetime.now(timezone.utc)).total_seconds() / 86400
          assert 29 <= remaining_days <= 30.1

          with sqlite3.connect(DB_PATH) as db:
              db.execute(
                  "UPDATE sessions SET expires_at = ? WHERE token_hash = ?",
                  (
                      "2000-01-01T00:00:00+00:00",
                      _token_hash(result["token"]),
                  ),
              )
              db.commit()

          try:
              current_user(f"Bearer {result['token']}")
              raise AssertionError("expired session was accepted")
          except HTTPException as exc:
              assert exc.status_code == 401

          print("security hardening ok")
          PY

