name: Test Backend

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/backup-restore-v1, feature/security-hardening-v1, feature/public-readiness-v1, feature/club-instance-identity-v1, feature/neutral-admin-ui-v1, feature/autonomous-onboarding-v1, feature/club-setup-status-v1, feature/backup-instance-protection-v1, feature/instance-isolation-visibility-v1, feature/settings-permission-v1, feature/settings-permission-integration-v1, feature/settings-permission-ui-v1, feature/settings-permission-summary-v1, feature/club-manager-role-v1, feature/multi-tenant-package1, feature/multi-tenant-package2, feature/multi-tenant-package3 ]
    paths:
      - "backend/**"
      - ".github/workflows/test-backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m py_compile app/main.py

      - name: Initialize database
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-test.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-backups
        run: python -c "from app.main import init_db; init_db(); print('database ok')"

      - name: Test multi-tenant clubs foundation
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-tenant-foundation.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-tenant-foundation-backups
        run: |
          rm -f /tmp/flapamamaku-tenant-foundation.db
          rm -rf /tmp/flapamamaku-tenant-foundation-backups
          python - <<'PY'
          from app.main import CURRENT_SCHEMA_VERSION, connect, init_db

          init_db()

          with connect() as db:
              tables = {
                  row["name"]
                  for row in db.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  ).fetchall()
              }
              assert "clubs" in tables

              columns = {
                  row["name"]
                  for row in db.execute("PRAGMA table_info(clubs)").fetchall()
              }
              required = {
                  "id", "slug", "name", "short_name", "active", "logo",
                  "primary_color", "secondary_color", "created_at", "updated_at",
                  "description", "website", "email", "phone", "address",
                  "city", "country", "app_title", "welcome_text",
              }
              assert required.issubset(columns), required - columns

              club = db.execute(
                  "SELECT * FROM clubs WHERE slug = ?",
                  ("flapamamaku",),
              ).fetchone()
              assert club is not None
              assert club["id"] == 1
              assert club["name"] == "FLAPAMAMAKU"
              assert club["short_name"] == "FLAPAMAMAKU"
              assert club["active"] == 1

              migration = db.execute(
                  "SELECT name FROM schema_migrations WHERE version = 9"
              ).fetchone()
              assert migration is not None
              assert migration["name"] == "multi-tenant-clubs-foundation"
              assert CURRENT_SCHEMA_VERSION == 10

              member = db.execute(
                  """
                  INSERT INTO members (name, role, since, created_at)
                  VALUES (?, ?, ?, ?)
                  """,
                  ("Paket 1 Bestand", "Mitglied", "2026", "2026-09-30T00:00:00+00:00"),
              )
              member_id = member.lastrowid
              news = db.execute(
                  """
                  INSERT INTO news (title, text, date, created_at)
                  VALUES (?, ?, ?, ?)
                  """,
                  ("Paket 1 Bestand", "Unverändert", "30.09.2026", "2026-09-30T00:00:00+00:00"),
              )
              news_id = news.lastrowid
              db.commit()

          init_db()

          with connect() as db:
              assert db.execute("SELECT COUNT(*) FROM clubs").fetchone()[0] == 1
              assert db.execute(
                  "SELECT id FROM members WHERE name = ?",
                  ("Paket 1 Bestand",),
              ).fetchone()[0] == member_id
              assert db.execute(
                  "SELECT id FROM news WHERE title = ?",
                  ("Paket 1 Bestand",),
              ).fetchone()[0] == news_id

          print("multi-tenant clubs foundation ok")
          PY

      - name: Test FLAPAMAMAKU club data migration
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-package2-migration.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-package2-backups
        run: |
          rm -f /tmp/flapamamaku-package2-migration.db
          rm -rf /tmp/flapamamaku-package2-backups
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db_path = Path("/tmp/flapamamaku-package2-migration.db")
          with sqlite3.connect(db_path) as db:
              db.executescript(
                  """
                  CREATE TABLE news (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      title TEXT NOT NULL,
                      text TEXT NOT NULL,
                      date TEXT NOT NULL,
                      image_url TEXT NOT NULL DEFAULT '',
                      image_data BLOB,
                      image_mime TEXT NOT NULL DEFAULT '',
                      sort_order INTEGER NOT NULL DEFAULT 0,
                      created_at TEXT NOT NULL
                  );
                  CREATE TABLE events (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      event_date TEXT NOT NULL DEFAULT '',
                      day TEXT NOT NULL,
                      month TEXT NOT NULL,
                      title TEXT NOT NULL,
                      location TEXT NOT NULL DEFAULT '',
                      time TEXT NOT NULL DEFAULT '',
                      created_at TEXT NOT NULL
                  );
                  CREATE TABLE members (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      name TEXT NOT NULL,
                      role TEXT NOT NULL DEFAULT 'Präsident',
                      since TEXT NOT NULL DEFAULT '',
                      birth_date TEXT NOT NULL DEFAULT '',
                      status TEXT NOT NULL DEFAULT 'Aktiv',
                      member_group TEXT NOT NULL DEFAULT '',
                      engagement TEXT NOT NULL DEFAULT '',
                      partner_name TEXT NOT NULL DEFAULT '',
                      phone_mobile TEXT NOT NULL DEFAULT '',
                      phone_private TEXT NOT NULL DEFAULT '',
                      phone_work TEXT NOT NULL DEFAULT '',
                      email TEXT NOT NULL DEFAULT '',
                      address TEXT NOT NULL DEFAULT '',
                      occupation TEXT NOT NULL DEFAULT '',
                      employer TEXT NOT NULL DEFAULT '',
                      employer_url TEXT NOT NULL DEFAULT '',
                      sort_order INTEGER NOT NULL DEFAULT 0,
                      photo_data BLOB,
                      photo_mime TEXT NOT NULL DEFAULT '',
                      created_at TEXT NOT NULL
                  );
                  CREATE TABLE app_config (
                      id INTEGER PRIMARY KEY CHECK (id = 1),
                      app_name TEXT NOT NULL DEFAULT 'FLAPAMAMAKU',
                      app_subtitle TEXT NOT NULL DEFAULT 'Fasnachtsgruppe Luzern',
                      primary_color TEXT NOT NULL DEFAULT '#8A101B',
                      updated_at TEXT NOT NULL
                  );
                  """
              )
              db.execute(
                  "INSERT INTO news (id,title,text,date,created_at) VALUES (41,?,?,?,?)",
                  ("Alt News", "Bestehend", "30.09.2026", "2026-09-30T00:00:00+00:00"),
              )
              db.execute(
                  "INSERT INTO events (id,day,month,title,created_at) VALUES (51,?,?,?,?)",
                  ("30", "09", "Alt Termin", "2026-09-30T00:00:00+00:00"),
              )
              db.execute(
                  "INSERT INTO members (id,name,role,since,created_at) VALUES (61,?,?,?,?)",
                  ("Alt Mitglied", "Mitglied", "2020", "2026-09-30T00:00:00+00:00"),
              )
              db.execute(
                  "INSERT INTO app_config (id,app_name,app_subtitle,primary_color,updated_at) VALUES (1,?,?,?,?)",
                  ("FLAPAMAMAKU", "Fasnachtsgruppe Luzern", "#8A101B", "2026-09-30T00:00:00+00:00"),
              )
              db.commit()

          from app.main import CURRENT_SCHEMA_VERSION, connect, init_db
          init_db()

          with connect() as db:
              assert CURRENT_SCHEMA_VERSION == 10
              assert db.execute("SELECT id, club_id FROM news WHERE id = 41").fetchone()[:] == (41, 1)
              assert db.execute("SELECT id, club_id FROM events WHERE id = 51").fetchone()[:] == (51, 1)
              assert db.execute("SELECT id, club_id FROM members WHERE id = 61").fetchone()[:] == (61, 1)

              migration = db.execute(
                  "SELECT name FROM schema_migrations WHERE version = 10"
              ).fetchone()
              assert migration is not None
              assert migration["name"] == "flapamamaku-club-data-migration"

              club = db.execute(
                  "SELECT id, slug, name, primary_color FROM clubs WHERE id = 1"
              ).fetchone()
              assert club["slug"] == "flapamamaku"
              assert club["name"] == "FLAPAMAMAKU"
              assert club["primary_color"] == "#8A101B"

              for table in (
                  "news", "events", "members", "app_config", "member_filters",
                  "content_items", "content_images", "gallery_snapshots",
                  "push_notifications", "member_filter_links", "poll_votes",
                  "poll_suggestions", "push_deliveries", "event_registrations",
              ):
                  columns = {
                      row["name"]
                      for row in db.execute(f"PRAGMA table_info({table})").fetchall()
                  }
                  assert "club_id" in columns, table

          print("FLAPAMAMAKU package 2 migration ok")
          PY

      - name: Test package 3 API tenant isolation
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-package3-isolation.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-package3-backups
          FLAPAMAMAKU_INSTANCE_ID: flapamamaku
        run: |
          rm -f /tmp/flapamamaku-package3-isolation.db
          rm -rf /tmp/flapamamaku-package3-backups
          python - <<'PY'
          from fastapi import HTTPException
          from app.main import (
              NewsPayload,
              ContentPayload,
              connect,
              create_row,
              delete_content,
              get_content,
              init_db,
              list_rows,
              update_row,
          )

          init_db()
          with connect() as db:
              now = "2026-09-30T00:00:00+00:00"
              cursor = db.execute(
                  """
                  INSERT INTO clubs (
                      slug, name, short_name, active,
                      primary_color, secondary_color,
                      created_at, updated_at
                  ) VALUES (?, ?, ?, 1, '#000000', '#FFFFFF', ?, ?)
                  """,
                  ("testverein", "Testverein", "Testverein", now, now),
              )
              foreign_club_id = cursor.lastrowid
              db.execute(
                  """
                  INSERT INTO news (
                      title, text, date, sort_order, created_at, club_id
                  ) VALUES (?, ?, ?, 1, ?, ?)
                  """,
                  ("Fremde News", "Nur Testverein", "30.09.2026", now, foreign_club_id),
              )
              foreign_news_id = db.execute(
                  "SELECT id FROM news WHERE title = 'Fremde News'"
              ).fetchone()[0]
              db.execute(
                  """
                  INSERT INTO content_items (
                      section, title, text, link_url, sort_order, created_at, club_id
                  ) VALUES ('gallery', ?, '', '', 1, ?, ?)
                  """,
                  ("Fremder Inhalt", now, foreign_club_id),
              )
              foreign_content_id = db.execute(
                  "SELECT id FROM content_items WHERE title = 'Fremder Inhalt'"
              ).fetchone()[0]
              db.commit()

          own = create_row(
              "news",
              NewsPayload(title="Eigene News", text="FLAPAMAMAKU", date="30.09.2026"),
          )
          rows = list_rows("news")
          titles = {row["title"] for row in rows}
          assert "Eigene News" in titles
          assert "Fremde News" not in titles
          assert own["club_id"] == 1

          try:
              update_row(
                  "news",
                  foreign_news_id,
                  NewsPayload(title="Manipuliert", text="Nein", date="30.09.2026"),
              )
              raise AssertionError("foreign news update was accepted")
          except HTTPException as exc:
              assert exc.status_code == 404

          fake_user = {
              "id": 1,
              "can_photos": True,
              "can_documents": True,
              "can_polls": True,
              "can_links": True,
              "can_contact": True,
              "can_about": True,
          }
          content = get_content(section="gallery", user=fake_user)
          assert all(item.get("title") != "Fremder Inhalt" for item in content)

          try:
              delete_content(foreign_content_id, user=fake_user)
              raise AssertionError("foreign content delete was accepted")
          except HTTPException as exc:
              assert exc.status_code == 404

          with connect() as db:
              assert db.execute(
                  "SELECT COUNT(*) FROM news WHERE id = ?",
                  (foreign_news_id,),
              ).fetchone()[0] == 1
              assert db.execute(
                  "SELECT COUNT(*) FROM content_items WHERE id = ?",
                  (foreign_content_id,),
              ).fetchone()[0] == 1

          print("package 3 API tenant isolation ok")
          PY

      - name: Test backup and restore
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-test.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-backups
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          from app.main import (
              DB_PATH,
              _create_database_backup,
              _restore_database_backup,
              init_db,
          )

          init_db()
          with sqlite3.connect(DB_PATH) as db:
              db.execute(
                  "INSERT INTO members (name, role, since, created_at) VALUES (?, ?, ?, ?)",
                  ("Restore Test", "Mitglied", "2026", "2026-09-28T00:00:00+00:00"),
              )
              db.commit()

          backup = _create_database_backup("workflow-test")

          with sqlite3.connect(DB_PATH) as db:
              db.execute("DELETE FROM members WHERE name = ?", ("Restore Test",))
              db.commit()

          result = _restore_database_backup(backup)
          assert result["restored"] is True
          assert result["sessions_cleared"] is True
          assert result["safety_backup"]["name"].endswith(".db")

          with sqlite3.connect(DB_PATH) as db:
              count = db.execute(
                  "SELECT COUNT(*) FROM members WHERE name = ?",
                  ("Restore Test",),
              ).fetchone()[0]
              sessions = db.execute("SELECT COUNT(*) FROM sessions").fetchone()[0]

          assert count == 1, "restored member is missing"
          assert sessions == 0, "sessions were not cleared"
          assert Path(result["safety_backup"]["name"]).suffix == ".db"
          print("backup restore ok")
          PY

      - name: Test login rate limit and session expiry
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-security-test.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-security-backups
          FLAPAMAMAKU_LOGIN_RATE_MAX_ATTEMPTS: "3"
          FLAPAMAMAKU_LOGIN_RATE_WINDOW_SECONDS: "600"
          FLAPAMAMAKU_LOGIN_LOCKOUT_SECONDS: "60"
          FLAPAMAMAKU_SESSION_LIFETIME_DAYS: "30"
        run: |
          rm -f /tmp/flapamamaku-security-test.db
          python - <<'PY'
          import sqlite3
          from datetime import datetime, timezone
          from fastapi import HTTPException
          from starlette.requests import Request
          from app.main import (
              DB_PATH,
              LoginPayload,
              _check_login_rate_limit,
              _hash_password,
              _login_rate_key,
              _record_login_failure,
              _token_hash,
              current_user,
              init_db,
              login,
          )

          init_db()
          password_hash, salt = _hash_password("Geheim123!")
          with sqlite3.connect(DB_PATH) as db:
              cursor = db.execute(
                  """
                  INSERT INTO users (
                      username, password_hash, password_salt, active,
                      role_key, permission_overrides, created_at
                  ) VALUES (?, ?, ?, 1, 'member', '{}', ?)
                  """,
                  (
                      "security-test",
                      password_hash,
                      salt,
                      datetime.now(timezone.utc).isoformat(),
                  ),
              )
              user_id = cursor.lastrowid
              db.commit()

          scope = {
              "type": "http",
              "method": "POST",
              "path": "/api/auth/login",
              "headers": [],
              "client": ("127.0.0.1", 12345),
              "server": ("testserver", 80),
              "scheme": "http",
              "query_string": b"",
          }
          request = Request(scope)
          key = _login_rate_key(request, "security-test")

          for _ in range(3):
              _record_login_failure(key)

          try:
              _check_login_rate_limit(key)
              raise AssertionError("rate limit was not enforced")
          except HTTPException as exc:
              assert exc.status_code == 429
              assert "Retry-After" in (exc.headers or {})

          from app import main as main_module
          main_module._clear_login_failures(key)
          result = login(
              request,
              LoginPayload(username="security-test", password="Geheim123!"),
          )
          assert result["token"]
          expires = datetime.fromisoformat(result["expires_at"])
          remaining_days = (expires - datetime.now(timezone.utc)).total_seconds() / 86400
          assert 29 <= remaining_days <= 30.1

          with sqlite3.connect(DB_PATH) as db:
              db.execute(
                  "UPDATE sessions SET expires_at = ? WHERE token_hash = ?",
                  (
                      "2000-01-01T00:00:00+00:00",
                      _token_hash(result["token"]),
                  ),
              )
              db.commit()

          try:
              current_user(f"Bearer {result['token']}")
              raise AssertionError("expired session was accepted")
          except HTTPException as exc:
              assert exc.status_code == 401

          print("security hardening ok")
          PY

      - name: Test club instance identity
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-instance-test.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-instance-backups
          FLAPAMAMAKU_INSTANCE_ID: test-verein
        run: |
          rm -f /tmp/flapamamaku-instance-test.db
          python - <<'PY'
          from app.main import INSTANCE_ID, get_app_config, health, init_db

          init_db()
          assert INSTANCE_ID == "test-verein"
          config = get_app_config()
          assert config["instance_id"] == "test-verein", config
          status = health()
          assert status["instance_id"] == "test-verein", status
          print("club instance identity ok")
          PY

      - name: Test club setup status
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-setup-status.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-setup-status-backups
          FLAPAMAMAKU_INSTANCE_ID: test-verein
        run: |
          rm -f /tmp/flapamamaku-setup-status.db
          rm -rf /tmp/flapamamaku-setup-status-backups
          python - <<'PY'
          from app.main import _club_setup_status, connect, init_db

          init_db()
          initial = _club_setup_status()
          assert initial["required_complete"] is False
          assert initial["required"]["administrator"]["ok"] is False
          assert initial["required"]["identity"]["ok"] is False
          assert initial["required"]["contact"]["ok"] is False
          assert initial["required"]["modules"]["ok"] is True

          with connect() as db:
              db.execute(
                  """
                  UPDATE app_config
                  SET app_name = ?, contact_email = ?, club_description = ?
                  WHERE id = 1
                  """,
                  ("Test Verein", "admin@test.invalid", "Testbeschreibung"),
              )
              db.commit()

          updated = _club_setup_status()
          assert updated["required"]["identity"]["ok"] is True
          assert updated["required"]["contact"]["ok"] is True
          assert updated["recommended"]["description"]["ok"] is True
          assert updated["required_complete"] is False
          print("club setup status ok")
          PY

      - name: Test backup club instance protection
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-instance-backup.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-instance-backups
          FLAPAMAMAKU_INSTANCE_ID: test-verein
        run: |
          rm -f /tmp/flapamamaku-instance-backup.db
          rm -rf /tmp/flapamamaku-instance-backups
          python - <<'PY'
          import shutil
          import sqlite3
          from app.main import (
              INSTANCE_ID,
              _create_database_backup,
              _validate_restore_database,
              connect,
              init_db,
          )

          init_db()
          assert INSTANCE_ID == "test-verein"
          with connect() as db:
              stored = db.execute(
                  "SELECT instance_id FROM app_config WHERE id = 1"
              ).fetchone()[0]
              assert stored == "test-verein"

          backup = _create_database_backup("instance-test")
          assert backup.name.startswith("test-verein-")
          assert _validate_restore_database(backup) >= 7

          foreign = backup.with_name("renamed-foreign.db")
          shutil.copy2(backup, foreign)
          with sqlite3.connect(foreign) as db:
              db.execute(
                  "UPDATE app_config SET instance_id = ? WHERE id = 1",
                  ("anderer-verein",),
              )
              db.commit()

          try:
              _validate_restore_database(foreign)
              raise AssertionError("foreign club backup was accepted")
          except RuntimeError as exc:
              assert "another club instance" in str(exc)

          print("backup club instance protection ok")
          PY

      - name: Test two club database isolation
        run: |
          rm -f /tmp/club-a.db
          rm -rf /tmp/club-a-backups
          FLAPAMAMAKU_DB=/tmp/club-a.db \
          FLAPAMAMAKU_BACKUP_DIR=/tmp/club-a-backups \
          FLAPAMAMAKU_INSTANCE_ID=club-a \
          python - <<'PY'
          from app.main import connect, init_db

          init_db()
          with connect() as db:
              db.execute(
                  "INSERT INTO members (name, role, since, created_at) VALUES (?, ?, ?, ?)",
                  ("Club A Member", "Mitglied", "2026", "2026-09-30T00:00:00+00:00"),
              )
              db.commit()
              stored = db.execute(
                  "SELECT instance_id FROM app_config WHERE id = 1"
              ).fetchone()[0]
              assert stored == "club-a"
          print("club-a initialized")
          PY

          set +e
          OUTPUT=$(
            FLAPAMAMAKU_DB=/tmp/club-a.db \
            FLAPAMAMAKU_BACKUP_DIR=/tmp/club-a-backups \
            FLAPAMAMAKU_INSTANCE_ID=club-b \
            python - <<'PY' 2>&1
          from app.main import init_db

          init_db()
          PY
          )
          CODE=$?
          set -e

          if [ "$CODE" -eq 0 ]; then
            echo "::error::Club B incorrectly accepted Club A database"
            exit 1
          fi

          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Database belongs to another club instance"
          echo "two club database isolation ok"

      - name: Test separate club settings permission
        env:
          FLAPAMAMAKU_DB: /tmp/flapamamaku-settings-permission.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/flapamamaku-settings-permission-backups
        run: |
          rm -f /tmp/flapamamaku-settings-permission.db
          rm -rf /tmp/flapamamaku-settings-permission-backups
          python - <<'PY'
          from app.main import (
              CURRENT_SCHEMA_VERSION,
              ROLE_DEFINITIONS,
              connect,
              init_db,
          )

          init_db()
          assert CURRENT_SCHEMA_VERSION == 10
          assert ROLE_DEFINITIONS["board"]["permissions"]["can_manage_settings"] is True
          assert ROLE_DEFINITIONS["board"]["permissions"]["can_manage_users"] is False
          assert ROLE_DEFINITIONS["admin"]["permissions"]["can_manage_settings"] is True
