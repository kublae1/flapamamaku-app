name: Build iOS SideStore IPA

on:
  workflow_dispatch:
  push:
    branches: [ ios-sideload-baseline-275 ]

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      IOS_BUNDLE_ID: ch.flapamamaku.app
      APP_VERSION: 0.8.19
      APP_BUILD_NUMBER: 275
      API_BASE_URL: ${{ vars.FLAPAMAMAKU_API_BASE_URL || 'https://flapamamaku.kublaecloud.synology.me' }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform files
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --project-name flapamamaku_app --org ch.flapamamaku .
          fi

      - name: Configure iOS app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          import plistlib

          bundle_id = os.environ["IOS_BUNDLE_ID"]
          pbx = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = pbx.read_text()
          text = re.sub(
              r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;',
              f'PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};',
              text,
          )
          pbx.write_text(text)

          plist_path = Path("ios/Runner/Info.plist")
          with plist_path.open("rb") as f:
              plist = plistlib.load(f)

          plist["CFBundleDisplayName"] = "FLAPAMAMAKU"
          plist["NSFaceIDUsageDescription"] = "FLAPAMAMAKU verwendet Face ID für die sichere Anmeldung."
          plist["NSPhotoLibraryUsageDescription"] = "FLAPAMAMAKU benötigt Zugriff auf Fotos für Vereinsbilder und Galerien."
          plist["NSCameraUsageDescription"] = "FLAPAMAMAKU benötigt Zugriff auf die Kamera für Vereinsbilder."

          with plist_path.open("wb") as f:
              plistlib.dump(plist, f)

          print("Configured bundle id:", bundle_id)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --build-name="$APP_VERSION" \
            --build-number="$APP_BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=APP_BUILD_NUMBER="$APP_BUILD_NUMBER"

      - name: Package SideStore IPA
        shell: bash
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          /usr/bin/zip -qry "FLAPAMAMAKU-0.8.19-build275-unsigned.ipa" Payload
          ls -lh "FLAPAMAMAKU-0.8.19-build275-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: flapamamaku-ios-sidestore-0.8.19-build275
          path: FLAPAMAMAKU-0.8.19-build275-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
