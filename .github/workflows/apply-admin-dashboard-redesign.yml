name: Apply approved admin dashboard redesign

on:
  push:
    branches:
      - feature/admin-dashboard-redesign-v1
    paths:
      - tools/apply_admin_dashboard_redesign.py
      - .github/workflows/apply-admin-dashboard-redesign.yml

permissions:
  contents: write

jobs:
  apply-redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-dashboard-redesign-v1
          fetch-depth: 0

      - name: Apply UI-only redesign
        run: python tools/apply_admin_dashboard_redesign.py

      - name: Commit redesigned admin UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-admin-dashboard-redesign.yml tools/apply_admin_dashboard_redesign.py
          git add backend/static/admin.html
          git commit -m "feat: redesign club admin dashboard UI"
          git push origin HEAD:feature/admin-dashboard-redesign-v1
