name: Critical Tenant Admin Regression

on:
  push:
    branches:
      - fix/critical-tenant-admin-regression-20261005
      - fix/tenant-recovery-20261005
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt httpx

      - name: Compile backend regression code
        working-directory: backend
        run: >-
          python -m py_compile
          app/main.py app/phase45.py app/runtime.py
          tests/critical_tenant_admin_regression.py
          tests/test_multitenant_isolation.py
          tests/test_multiclub_app_behavior.py
          tests/test_club_billing_suspension.py
          tests/test_white_label_onboarding.py

      - name: Verify production tenant and admin repair
        run: python backend/tests/critical_tenant_admin_regression.py

      - name: Verify integrated multi-tenant isolation and media
        env:
          FLAPAMAMAKU_DB: /tmp/recovery-multitenant.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/recovery-multitenant-backups
        run: |
          rm -f "$FLAPAMAMAKU_DB"
          rm -rf "$FLAPAMAMAKU_BACKUP_DIR"
          python backend/tests/test_multitenant_isolation.py

      - name: Verify multi-club app behavior
        env:
          FLAPAMAMAKU_DB: /tmp/recovery-multiclub.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/recovery-multiclub-backups
        run: |
          rm -f "$FLAPAMAMAKU_DB"
          rm -rf "$FLAPAMAMAKU_BACKUP_DIR"
          python backend/tests/test_multiclub_app_behavior.py

      - name: Verify per-club billing and suspension
        env:
          FLAPAMAMAKU_DB: /tmp/recovery-billing.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/recovery-billing-backups
        run: |
          rm -f "$FLAPAMAMAKU_DB"
          rm -rf "$FLAPAMAMAKU_BACKUP_DIR"
          python backend/tests/test_club_billing_suspension.py

      - name: Verify white-label onboarding
        env:
          FLAPAMAMAKU_DB: /tmp/recovery-onboarding.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/recovery-onboarding-backups
        run: |
          rm -f "$FLAPAMAMAKU_DB"
          rm -rf "$FLAPAMAMAKU_BACKUP_DIR"
          python backend/tests/test_white_label_onboarding.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Verify recovered Superuser club switch and member mapping
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          profile = json.loads(Path('config/white-label/flapamamaku.json').read_text())
          assert profile['id'] == 'flapamamaku'
          assert profile['allow_server_change'] is True

          admin = Path('backend/static/admin.html').read_text()
          assert 'tenant-switch' in admin
          assert 'Verein wechseln' in admin
          assert 'currentUser.is_super_admin' in admin

          runtime = Path('backend/app/runtime.py').read_text()
          assert 'user_club_members' in runtime
          assert '_drop_single_instance_guards' in runtime
          assert '_normalize_club_ids' in runtime
          assert '_admin_selector_injection' not in runtime
          assert '/api/system/platform-clubs' not in runtime

          api = Path('lib/data/api_service.dart').read_text()
          assert 'allowServerChange' in api
          print('Recovered multi-club core, Superuser-only switch and per-club member mapping verified')
          PY
