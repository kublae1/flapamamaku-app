name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/docker-integration-v2 ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_APPLICATION_ID: ${{ vars.FLAPAMAMAKU_ANDROID_APPLICATION_ID || 'ch.flapamamaku.app' }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name flapamamaku_app .
          fi

      - name: Configure stable Android application ID
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          app_id = os.environ["ANDROID_APPLICATION_ID"]
          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file not found")

          text = gradle.read_text()

          if gradle.suffix == ".kts":
              text = re.sub(
                  r'namespace\s*=\s*"[^"]+"',
                  f'namespace = "{app_id}"',
                  text,
                  count=1,
              )
              text = re.sub(
                  r'applicationId\s*=\s*"[^"]+"',
                  f'applicationId = "{app_id}"',
                  text,
                  count=1,
              )
          else:
              text = re.sub(
                  r'namespace\s+["\'][^"\']+["\']',
                  f'namespace "{app_id}"',
                  text,
                  count=1,
              )
              text = re.sub(
                  r'applicationId\s+["\'][^"\']+["\']',
                  f'applicationId "{app_id}"',
                  text,
                  count=1,
              )

          gradle.write_text(text)
          print(f"Configured Android applicationId: {app_id}")
          PY

      - name: Configure Android permissions and biometrics
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.USE_BIOMETRIC' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' "$MANIFEST"
          fi
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$MANIFEST"
          fi

          MAIN_ACTIVITY=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' "$MAIN_ACTIVITY"
            sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' "$MAIN_ACTIVITY"
          fi

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FLAPAMAMAKU_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FLAPAMAMAKU_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLAPAMAMAKU_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLAPAMAMAKU_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No permanent release signing secrets configured yet."
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/flapamamaku-release.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=flapamamaku-release.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              text = kts.read_text()
              marker = "plugins {"
              prefix = '''import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''
              if "val keystoreProperties = Properties()" not in text:
                  text = prefix + text

              android_marker = "android {"
              signing = '''android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
              if 'create("release")' not in text:
                  text = text.replace(android_marker, signing, 1)

              text = text.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
              )
              kts.write_text(text)

          elif groovy.exists():
              text = groovy.read_text()
              prefix = '''def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''
              if "def keystoreProperties = new Properties()" not in text:
                  text = prefix + text

              android_marker = "android {"
              signing = '''android {
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''
              if "signingConfigs {" not in text:
                  text = text.replace(android_marker, signing, 1)

              text = text.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release",
              )
              groovy.write_text(text)
          else:
              raise SystemExit("Android Gradle file not found")
          PY

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          API_BASE_URL: ${{ vars.FLAPAMAMAKU_API_BASE_URL || 'http://192.168.0.215:8087' }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Build Play Store AAB
        env:
          API_BASE_URL: ${{ vars.FLAPAMAMAKU_API_BASE_URL || 'http://192.168.0.215:8087' }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Verify permanent signing is configured for distributable builds
        if: github.ref == 'refs/heads/main'
        run: |
          if [ "${{ steps.signing.outputs.configured }}" != "true" ]; then
            echo "::error::Permanent Android release signing is not configured."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: flapamamaku-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
