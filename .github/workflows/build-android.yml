name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name flapamamaku_app .
          fi

      - name: Install FLAPAMAMAKU launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/app_icon_vector.xml android/app/src/main/res/drawable/app_icon_vector.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/app_icon_vector"#' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: flapamamaku-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
