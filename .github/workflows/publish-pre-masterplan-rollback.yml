name: Publish Stable Final V1 Rollback Image

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-pre-masterplan-rollback.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kublae1/flapamamaku-backend
  SOURCE_SHA: 3cca02ce3dc32efecaefac1f3c6b7a2731cc95bb

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable final v1 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push stable rollback tag
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kublae1/flapamamaku-backend:rollback-stable-final-v1
          build-args: |
            FLAPAMAMAKU_BUILD_SHA=${{ env.SOURCE_SHA }}
