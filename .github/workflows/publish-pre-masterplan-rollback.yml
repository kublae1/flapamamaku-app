name: Publish Pre-Masterplan Rollback Image

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-pre-masterplan-rollback.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kublae1/flapamamaku-backend
  SOURCE_SHA: 7581f3d8319a8f17220e5e4b11de1e94c7afcab0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout last pre-masterplan working source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fixed rollback tag
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kublae1/flapamamaku-backend:rollback-pre-masterplan
          build-args: |
            FLAPAMAMAKU_BUILD_SHA=${{ env.SOURCE_SHA }}
