name: Masterplan Phase 9 Backend Image

on:
  push:
    branches:
      - finalize/masterplan-phase9-20261007
    paths:
      - "backend/**"
      - ".github/workflows/masterplan-phase9-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kublae1/flapamamaku-backend

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt httpx
      - name: Compile final runtime
        run: python -m py_compile backend/app/main.py backend/app/runtime.py backend/app/push_runtime.py backend/app/masterplan_extensions.py backend/app/platform.py backend/app/platform_store.py backend/app/platform_runtime.py
      - name: Verify push legacy compatibility
        env:
          FLAPAMAMAKU_DB: /tmp/push-final.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/push-final-backups
          FLAPAMAMAKU_INSTANCE_ID: push-final
          FLAPAMAMAKU_ENV: development
        run: python backend/tests/push_legacy_trigger_contract.py
      - name: Verify tenant member identity isolation
        env:
          FLAPAMAMAKU_DB: /tmp/tenant-final.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/tenant-final-backups
          FLAPAMAMAKU_INSTANCE_ID: flapamamaku
          FLAPAMAMAKU_ENV: development
          FLAPAMAMAKU_PLATFORM_DB: /tmp/nonexistent-platform.db
        run: python backend/tests/tenant_member_identity_regression.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push verified multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kublae1/flapamamaku-backend:masterplan-phase9-sha-${{ github.sha }}
          build-args: |
            FLAPAMAMAKU_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
