name: Recovery Masterplan Gate

on:
  push:
    branches:
      - recovery/masterplan-on-175c23b-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-masterplan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt httpx
      - name: Compile stable backend and isolated platform
        run: python -m py_compile backend/app/main.py backend/app/platform.py backend/app/platform_store.py backend/app/platform_runtime.py
      - name: Verify CMS contract
        run: python backend/tests/admin_cms_contract.py
      - name: Verify Phase 6 operations
        run: python backend/tests/phase6_8_operations.py
      - name: Verify Phase 8 pilot matrix
        run: python backend/tests/phase8_pilot_matrix.py
      - name: Verify Phase 9 platform contract
        working-directory: backend
        run: |
          python tests/phase9_platform_contract.py
          python tests/platform_club_selector_contract.py
      - name: Start integrated multi-club backend
        env:
          FLAPAMAMAKU_DB: /tmp/recovery-masterplan.db
          FLAPAMAMAKU_BACKUP_DIR: /tmp/recovery-masterplan-backups
          FLAPAMAMAKU_INSTANCE_ID: flapamamaku
          FLAPAMAMAKU_ENV: development
          FLAPAMAMAKU_ALLOWED_ORIGINS: '*'
          FLAPAMAMAKU_BACKUP_INTERVAL_SECONDS: '86400'
        run: |
          rm -f /tmp/recovery-masterplan.db
          rm -rf /tmp/recovery-masterplan-backups
          mkdir -p /tmp/recovery-masterplan-backups
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8087 >/tmp/recovery-masterplan.log 2>&1 &
          echo $! >/tmp/recovery-masterplan.pid
      - name: Verify Phase 1 baseline
        env:
          FLAPAMAMAKU_DB: /tmp/recovery-masterplan.db
          FLAPAMAMAKU_INSTANCE_ID: flapamamaku
        run: python backend/tests/phase1_contract_smoke.py
      - name: Verify Phase 3-5 contract
        env:
          FLAPAMAMAKU_DB: /tmp/recovery-masterplan.db
          FLAPAMAMAKU_INSTANCE_ID: flapamamaku
        run: python backend/tests/phase3_5_contract.py
      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/recovery-masterplan.log || true

  flutter-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name flapamamaku_app .
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
