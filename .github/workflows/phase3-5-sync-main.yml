name: Phase 3-5 Sync Main

on:
  push:
    branches:
      - feature/masterplan-phase3-5-20261004
    paths:
      - .github/workflows/phase3-5-sync-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/masterplan-phase3-5-20261004
          fetch-depth: 0

      - name: Merge current main into Phase 3-5 branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts:"
            echo "$conflicts"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v '^pubspec.yaml$' | sed '/^$/d' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts require explicit resolution:"
              echo "$unexpected"
              exit 1
            fi
            git checkout --ours pubspec.yaml
            git add pubspec.yaml
          fi

          if git diff --cached --quiet && git diff --quiet; then
            echo "Branch already contains main."
            exit 0
          fi

          git commit -m "Sync main into Phase 3-5 branch and preserve Phase 3-5 version"
          git push origin HEAD:feature/masterplan-phase3-5-20261004
